services:
    webapp:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                MYSQL_CLIENT: mariadb-client
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - feics-commerce
        depends_on:
            - mariadb
            - mailpit

    mariadb:
        image: 'mariadb:11'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        volumes:
            - 'feics-commerce-database:/var/lib/mysql'
            - './vendor/laravel/sail/database/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - feics-commerce
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'feics-commerce-redis:/data'
        networks:
            - feics-commerce
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - feics-commerce

    mariadbmoodle:
        image: docker.io/bitnami/mariadb:latest
        environment:
            # ALLOW_EMPTY_PASSWORD is recommended only for development.
            - ALLOW_EMPTY_PASSWORD=yes
            - MARIADB_USER=bn_moodle
            - MARIADB_DATABASE=bitnami_moodle
            - MARIADB_CHARACTER_SET=utf8mb4
            - MARIADB_COLLATE=utf8mb4_unicode_ci
        volumes:
            - 'mariadb_data:/bitnami/mariadb'
        ports:
            - '3307:3306'
    moodle:
        image: docker.io/bitnami/moodle:4.5
        ports:
            - '8080:8080'
            - '8443:8443'
        environment:
            - MOODLE_DATABASE_HOST=mariadbmoodle
            - MOODLE_DATABASE_PORT_NUMBER=3307
            - MOODLE_DATABASE_USER=bn_moodle
            - MOODLE_DATABASE_NAME=bitnami_moodle
            # ALLOW_EMPTY_PASSWORD is recommended only for development.
            - ALLOW_EMPTY_PASSWORD=yes
        volumes:
            - 'moodle_data:/bitnami/moodle'
            - 'moodledata_data:/bitnami/moodledata'
        depends_on:
            - mariadbmoodle
        extra_hosts:
            host.docker.internal: host-gateway

networks:
    feics-commerce:
        name: feics/commerce

volumes:
    feics-commerce-database:
        driver: local
    feics-commerce-redis:
        driver: local
    mariadb_data:
        driver: local
    moodle_data:
        driver: local
    moodledata_data:
        driver: local
